[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leap-c-lab"
version = "0.1.0"
description = "Example environments and planners for leap-c"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "leap-c",
  "acados-template",
  "casadi",
  "gymnasium>=1.1.1",
  "matplotlib",
  "numpy>=1.26.0",
  "scipy==1.15.2",
  "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "marimo>=0.24.0",
  "moviepy",
  "pygame",
  "pytest==8.4.0",
  "ruff==0.12.12",
]
i4b = ["i4b", "pandas>=2.0.0"]

[tool.setuptools.packages.find]
include = ["leapc_lab*"]

[tool.uv.sources]
# leap-c: default from GitHub (for CI and other developers).
leap-c = { git = "https://github.com/leap-c/leap-c.git", branch = "main" }
# leap-c local development: uncomment the line below and comment out the git source above.
# leap-c = { path = "/path/to/your/leap-c", editable = true }

# acados-template is not on PyPI. Uncomment and point at your local acados checkout.
# Build acados first: https://docs.acados.org/
# acados-template = { path = "/path/to/your/acados/interfaces/acados_template", editable = true }

# i4b is not on PyPI. Pinned to the revision that ships i4b_data (gains profiles,
# weather) inside the wheel (leap-c/i4b#1).
i4b = { git = "https://github.com/leap-c/i4b.git", rev = "549c6ba847d2b13d5a66a0f436e4c827b643634f" }

[tool.pytest.ini_options]
testpaths = "tests"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
ignore = [
  "E741",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
]
extend-select = ["D", "I", "NPY", "UP045", "E501"]
